[tools]
python = "3.14"

[settings.python]
uv_venv_auto = "create|source"

[hooks]
enter = "prek install"

[tasks.fix]
description = "Apply formatting and lint fixes"
run = [
  "ruff format",
  "ruff check --fix",
]

[tasks.check]
description = "Verify formatting, linting, type checking, and tests"
run = [
  "ruff format --check",
  "ruff check",
  "ty check",
  "pytest",
]

[tasks.test]
description = "Run tests"
run = [
  "uv run --python=3.11 pytest",
  "uv run --python=3.12 pytest",
  "uv run --python=3.13 pytest",
  "uv run --python=3.14 pytest",
]

[tasks.coverage]
description = "Run tests and generate coverage report"
run = [
  "uv run --python=3.11 coverage run -m pytest",
  "uv run --python=3.12 coverage run -m pytest",
  "uv run --python=3.13 coverage run -m pytest",
  "uv run --python=3.14 coverage run -m pytest",
  "uv run coverage combine",
  "uv run coverage report",
  "uv run coverage html",
]

[tasks.prek]
description = "Run pre-commit hooks"
run = "prek run --all-files"

[tasks."prek:install"]
description = "Install pre-commit hooks"
run = "prek install"

[tasks."prek:update"]
description = "Update pre-commit hooks"
run = "prek update --freeze"
