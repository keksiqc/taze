[project]
name = "taze"
version = "0.5.0"
description = "🥬 Keep your Python deps fresh"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Keksi", email = "hello@keksi.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "msgspec>=0.21.1",
  "packaging>=26.3",
  "rich>=15.0.0",
  "typer>=0.27.2",
]

[project.scripts]
taze = "taze.main:app"

[dependency-groups]
dev = [
  "commitizen>=4.18.1",
  "coverage>=7.16.1",
  "prek>=0.5.3",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "ty>=0.0.82",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_files = [
  "pyproject.toml",
  "taze/__init__.py",
]
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.ruff]
cache-dir = ".cache/ruff"
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "S101"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["taze"]
lines-after-imports = 2

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.taze]
github_actions_pin = true
github_actions_style = "sha"

[tool.tombi.files]
exclude = ["uv.lock"]

[tool.uv.build-backend]
module-name = "taze"
module-root = ""
