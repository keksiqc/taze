[project]
name = "taze"
version = "0.2.3"
description = "🥬 Keep your Python deps fresh"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "packaging>=26.2",
  "rich>=15.0.0",
  "typer>=0.27.0",
]

[project.scripts]
taze = "taze.main:app"

[dependency-groups]
dev = [
  "commitizen>=4.16.5",
  "prek>=0.4.11",
  "pytest>=9.1.1",
  "ruff>=0.16.0",
  "ty>=0.0.63",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_files = [
  "pyproject.toml",
  "taze/__init__.py",
]
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.ruff]
cache-dir = ".cache/ruff"
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "S101"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["taze"]
lines-after-imports = 2

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.uv.build-backend]
module-name = "taze"
module-root = ""
