name: Benchmark

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run benchmarks (PR)
        working-directory: pr
        run: |
          uv sync --frozen
          uv run pytest tests/core/test_resolution_benchmarks.py --benchmark-only --benchmark-json=../pr-benchmark.json -q

      - name: Run benchmarks (base)
        working-directory: base
        run: |
          uv sync --frozen
          if [ -f tests/core/test_resolution_benchmarks.py ]; then
            uv run pytest tests/core/test_resolution_benchmarks.py --benchmark-only --benchmark-json=../base-benchmark.json -q
          else
            echo '{"benchmarks": []}' > ../base-benchmark.json
          fi

      - name: Compare benchmarks
        run: python3 pr/.github/scripts/compare_benchmarks.py base-benchmark.json pr-benchmark.json > comparison.md

      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comparison.md", "utf8");
            const marker = "<!-- benchmark-comment -->";
            const comment = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
